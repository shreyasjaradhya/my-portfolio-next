<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D131F"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Trace Pulse Filter -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', 'Noto Sans', sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: #F8FAFC;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', 'Noto Sans', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        fill: #38BDF8;
        text-transform: uppercase;
      }
      .text-badges {
        font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 2px;
        fill: #94A3B8;
      }
      .circuit-line {
        stroke: #1E293B;
        stroke-width: 1.2;
        fill: none;
      }
      .active-trace {
        stroke: url(#traceGrad);
        stroke-width: 1.5;
        fill: none;
      }
      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; r: 3; }
        50% { opacity: 1; r: 4.5; }
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="846" height="216" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Circuit Grid Background (Subtle) -->
  <g opacity="0.25">
    <line x1="40" y1="0" x2="40" y2="220" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 8"/>
    <line x1="810" y1="0" x2="810" y2="220" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 8"/>
    <line x1="0" y1="35" x2="850" y2="35" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 8"/>
    <line x1="0" y1="185" x2="850" y2="185" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 8"/>
  </g>

  <!-- Left Circuit Traces -->
  <path d="M 30,50 L 90,50 L 130,90 L 190,90" class="circuit-line"/>
  <path d="M 30,75 L 75,75 L 110,110 L 170,110" class="active-trace"/>
  <path d="M 40,165 L 105,165 L 140,130 L 200,130" class="circuit-line"/>
  <circle cx="190" cy="90" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="170" cy="110" r="3.5" fill="#10B981" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4.2;3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="130" r="3" fill="#38BDF8" opacity="0.8"/>

  <!-- Right Circuit Traces -->
  <path d="M 820,50 L 760,50 L 720,90 L 660,90" class="circuit-line"/>
  <path d="M 820,75 L 775,75 L 740,110 L 680,110" class="active-trace"/>
  <path d="M 810,165 L 745,165 L 710,130 L 650,130" class="circuit-line"/>
  <circle cx="660" cy="90" r="3" fill="#38BDF8" opacity="0.8"/>
  <circle cx="680" cy="110" r="3.5" fill="#38BDF8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4.2;3" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="130" r="3" fill="#10B981" opacity="0.8"/>

  <!-- IC Chip Form Factor Corner Accents -->
  <!-- Top Left Corner -->
  <path d="M 18,32 L 18,18 L 32,18" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>
  <!-- Top Right Corner -->
  <path d="M 832,32 L 832,18 L 818,18" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>
  <!-- Bottom Left Corner -->
  <path d="M 18,188 L 18,202 L 32,202" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>
  <!-- Bottom Right Corner -->
  <path d="M 832,188 L 832,202 L 818,202" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.75"/>

  <!-- Central Circuit Glow Accent Behind Text -->
  <ellipse cx="425" cy="110" rx="260" ry="45" fill="#0284C7" opacity="0.08" filter="url(#pulseGlow)"/>

  <!-- Center Content -->
  <!-- Main Name Title -->
  <text x="425" y="86" text-anchor="middle" class="text-title">SHREYAS ARADHYA</text>

  <!-- Sub-Branch Technical Discipline -->
  <text x="425" y="122" text-anchor="middle" class="text-sub">Electronics &amp; Communication Engineering</text>

  <!-- Divider Line with Micro IC Pads -->
  <g>
    <line x1="280" y1="142" x2="570" y2="142" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="340" y1="142" x2="510" y2="142" stroke="url(#traceGrad)" stroke-width="1.6"/>
    <circle cx="280" cy="142" r="2.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="570" cy="142" r="2.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="425" cy="142" r="3" fill="#10B981" opacity="0.9"/>
  </g>

  <!-- Engineering Domains Specification -->
  <text x="425" y="176" text-anchor="middle" class="text-badges">
    <tspan fill="#38BDF8">Hardware</tspan>
    <tspan fill="#475569"> &nbsp;|&nbsp; </tspan>
    <tspan fill="#F8FAFC">FPGA</tspan>
    <tspan fill="#475569"> &nbsp;|&nbsp; </tspan>
    <tspan fill="#38BDF8">VLSI</tspan>
    <tspan fill="#475569"> &nbsp;|&nbsp; </tspan>
    <tspan fill="#F8FAFC">Embedded Systems</tspan>
  </text>
</svg>
