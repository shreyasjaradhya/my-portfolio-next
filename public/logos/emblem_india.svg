<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- State Emblem of India representation -->
  <g fill="#2b2b2b" stroke="#2b2b2b">
    <!-- Center Lion -->
    <path d="M 40 18 Q 50 12 60 18 Q 66 28 62 42 Q 58 52 50 56 Q 42 52 38 42 Q 34 28 40 18 Z" fill="#3a3a3a"/>
    <circle cx="50" cy="24" r="5" fill="#1a1a1a"/>
    <path d="M 46 32 Q 50 35 54 32" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M 43 22 Q 45 20 47 22 M 53 22 Q 55 20 57 22" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    
    <!-- Left Lion silhouette -->
    <path d="M 28 26 Q 34 22 38 30 Q 36 44 26 50 Q 20 40 22 32 Q 24 26 28 26 Z" fill="#444444"/>
    <circle cx="28" cy="32" r="3" fill="#1a1a1a"/>
    
    <!-- Right Lion silhouette -->
    <path d="M 72 26 Q 66 22 62 30 Q 64 44 74 50 Q 80 40 78 32 Q 76 26 72 26 Z" fill="#444444"/>
    <circle cx="72" cy="32" r="3" fill="#1a1a1a"/>
    
    <!-- Capital Abacus -->
    <rect x="20" y="58" width="60" height="10" rx="3" fill="#2d2d2d"/>
    <!-- Ashoka Chakra center -->
    <circle cx="50" cy="63" r="4.5" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="50" cy="63" r="1.5" fill="#1f2937"/>
    <!-- Horse & Bull flanking -->
    <ellipse cx="32" cy="63" rx="4" ry="2.5" fill="#1f2937"/>
    <ellipse cx="68" cy="63" rx="4" ry="2.5" fill="#1f2937"/>
    
    <!-- Lotus Base -->
    <path d="M 24 70 C 35 78 65 78 76 70 C 72 75 62 79 50 79 C 38 79 28 75 24 70 Z" fill="#3a3a3a"/>
    <path d="M 18 80 L 82 80 L 80 84 L 20 84 Z" fill="#222222"/>
    
    <!-- Satyameva Jayate Banner -->
    <rect x="15" y="87" width="70" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="50" y="98" font-family="'Noto Sans Devanagari', 'Mangal', system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle" fill="#0f172a" letter-spacing="0.5">सत्यमेव जयते</text>
  </g>
</svg>
